<!doctype html>
<html><head><meta charset="utf-8"><title>Query pipeline</title>
<style>
  /* colours from palette.json, diagram section */
  body { margin:0; background:#fff; }
  svg { display:block; font-family:"Inter","DejaVu Sans",sans-serif; }
  .n { fill:#E3EEF7; stroke:#0072B2; stroke-width:1.5; }
  .t { fill:#F1F2F6; stroke:#4A4D5C; stroke-width:1.5; }
  .o { fill:#FBEDCF; stroke:#E69F00; stroke-width:1.5; }
  .embed { fill:#F5E6EF; stroke:#CC79A7; stroke-width:1.5; }
  .dense { fill:#DDF2EA; stroke:#009E73; stroke-width:1.5; }
  .sparse { fill:#FBEDCF; stroke:#E69F00; stroke-width:1.5; }
  .d { fill:#FBEDCF; stroke:#E69F00; stroke-width:1.5; }
  .a { stroke:#2B2F45; stroke-width:1.5; fill:none; marker-end:url(#m); }
  .loop { stroke:#E69F00; stroke-dasharray:5 4; marker-end:url(#mw); }
  .h { font-size:15px; font-weight:600; fill:#1B1E2E; }
  .s { font-size:12.5px; fill:#4A4D5C; }
  .l { font-size:12.5px; fill:#1B1E2E; font-weight:600; }
</style></head><body>
<svg width="860" height="312" viewBox="0 -12 860 312" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2F45"/></marker><marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker></defs>
  <!-- row 1 -->
  <rect class="t" x="10" y="20" width="120" height="62" rx="31"/><text class="h" x="70" y="47" text-anchor="middle">Query</text><text class="s" x="70" y="66" text-anchor="middle">text, k, filters</text>
  <rect class="embed" x="160" y="20" width="160" height="62" rx="10"/><text class="h" x="240" y="45" text-anchor="middle">Embed query</text><text class="s" x="240" y="65" text-anchor="middle">LRU cache, any model</text>
  <rect class="n" x="350" y="20" width="170" height="62" rx="10"/><text class="h" x="435" y="45" text-anchor="middle">Allowed set</text><text class="s" x="435" y="65" text-anchor="middle">namespace minus deletes</text>
  <rect class="dense" x="560" y="4" width="160" height="44" rx="10"/><text class="h" x="640" y="24" text-anchor="middle">Dense top m</text><text class="s" x="640" y="40" text-anchor="middle">FAISS with ID selector</text>
  <rect class="sparse" x="560" y="56" width="160" height="44" rx="10"/><text class="h" x="640" y="76" text-anchor="middle">Sparse top m</text><text class="s" x="640" y="92" text-anchor="middle">BM25, same set</text>
  <path class="a" d="M130,51 H158"/><path class="a" d="M320,51 H348"/>
  <path class="a" d="M520,51 C540,51 540,26 558,26"/><path class="a" d="M520,51 C540,51 540,78 558,78"/><circle cx="540" cy="51" r="3.5" fill="#2B2F45"/>
  <!-- fusion -->
  <rect class="n" x="750" y="20" width="100" height="62" rx="10"/><text class="h" x="800" y="45" text-anchor="middle">Fuse</text><text class="s" x="800" y="65" text-anchor="middle">weighted sum</text>
  <path class="a" d="M720,26 C735,26 735,45 748,45"/><path class="a" d="M720,78 C735,78 735,58 748,58"/>
  <!-- row 2, right to left -->
  <rect class="n" x="690" y="160" width="160" height="62" rx="10"/><text class="h" x="770" y="185" text-anchor="middle">Hydrate rows</text><text class="s" x="770" y="205" text-anchor="middle">apply metadata filter</text>
  <path class="a" d="M800,82 V158"/>
  <polygon class="d" points="575,191 625,156 675,191 625,226"/><text class="h" x="625" y="188" text-anchor="middle">k results</text><text class="s" x="625" y="204" text-anchor="middle">found?</text>
  <path class="a" d="M690,191 H677"/>
  <!-- widen loop -->
  <rect class="o" x="560" y="250" width="130" height="40" rx="10"/><text class="h" x="625" y="275" text-anchor="middle">Widen to 4m</text>
  <path class="a" d="M625,226 V248"/><text class="l" x="632" y="242">no</text>
  <path class="a loop" d="M560,270 C505,270 505,110 537,56"/>
  <!-- tail -->
  <text class="l" x="548" y="181">yes</text>
  <rect class="n" x="340" y="160" width="195" height="62" rx="10"/><text class="h" x="445" y="185" text-anchor="middle">Optional reranking</text><text class="s" x="445" y="205" text-anchor="middle">Grover, cross-encoder</text>
  <path class="a" d="M575,191 H537"/>
  <rect class="n" x="180" y="160" width="135" height="62" rx="10"/><text class="h" x="247" y="185" text-anchor="middle">Recency</text><text class="s" x="247" y="205" text-anchor="middle">weighting</text>
  <path class="a" d="M340,191 H317"/>
  <rect class="t" x="10" y="160" width="140" height="62" rx="31"/><text class="h" x="80" y="185" text-anchor="middle">Top k</text><text class="s" x="80" y="205" text-anchor="middle">with signals</text>
  <path class="a" d="M180,191 H152"/>
</svg></body></html>
