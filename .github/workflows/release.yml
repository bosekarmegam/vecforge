name: GitHub Release

# Creates (or updates) the GitHub release for a version tag (pushed, or given
# when run by hand from a branch), using the notes in
# .github/release-notes/<tag>.md and attaching the built package, the
# instructions PDF and the brand reel.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, e.g. v2.0.0 (created at the selected branch's commit if missing)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check version matches tag
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "pyproject.toml is $VERSION but the tag is $TAG"; exit 1
          fi

      - name: Create or update release
        run: |
          NOTES=".github/release-notes/${TAG}.md"
          [ -f "$NOTES" ] || { echo "missing $NOTES"; exit 1; }
          case "$TAG" in
            v2.0.0) TITLE="VecForge 2.0.0: AI memory for Claude, local MCP server, corrected quantum rerank" ;;
            *) TITLE="VecForge $TAG" ;;
          esac
          FILES="dist/* docs/VecForge-Instructions.pdf assets/brand/vecforge-reel.mp4"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --latest
            gh release upload "$TAG" $FILES --clobber
          else
            # why: a manual run from a branch creates the tag at that commit
            gh release create "$TAG" $FILES --title "$TITLE" --notes-file "$NOTES" --latest --target "$GITHUB_SHA"
          fi
