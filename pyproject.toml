[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vecforge"
version = "2.0.0"
description = "Forge your vector database. Own it forever. Local-first, encrypted, quantum-inspired, with persistent AI memory over MCP."
readme = "README.md"
license = {text = "Business Source License 1.1"}
requires-python = ">=3.10"
authors = [{name = "Suneel Bose K", email = "suneelbose@arcgx.in"}]
keywords = [
    "vector-database",
    "faiss",
    "embeddings",
    "search",
    "local-first",
    "encrypted",
    "mcp",
    "ai-memory",
    "claude",
    "rag",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pymupdf>=1.23.0",
    "click>=8.1.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "black>=23.7.0",
    "types-beautifulsoup4",
    "httpx>=0.24.0",
    "mcp>=1.2.0",
]
mcp = [
    "mcp>=1.2.0",
]
gpu = [
    "faiss-gpu>=1.7.4",
    "cupy>=12.0.0",
]
quantum = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
]
multimodal = [
    "open-clip-torch>=2.24.0",
    "openai-whisper>=20231117",
    "Pillow>=10.0.0",
]
cloud = [
    "boto3>=1.34.0",
    "google-cloud-storage>=2.14.0",
    "azure-storage-blob>=12.19.0",
]
encryption = [
    "sqlcipher3-binary>=0.5.0",
]

[project.scripts]
vecforge = "vecforge.cli.main:cli"
vecforge-mcp = "vecforge.mcp.server:run_server"

[project.urls]
Homepage = "https://bosekarmegam.github.io/vecforge/"
Repository = "https://github.com/bosekarmegam/vecforge"
Issues = "https://github.com/bosekarmegam/vecforge/issues"

[tool.setuptools.packages.find]
include = ["vecforge*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"vecforge/server/routes.py" = ["B008"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["faiss", "faiss.*", "fitz", "docx", "mcp.*", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# why: click and MCP tool decorators are untyped; the bodies are still checked
module = ["vecforge.cli.*", "vecforge.mcp.*"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
